# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version-file: 'ch1_integration/01_04_ci_for_go/go.mod'
    - name: Revive Action
      uses: morphy2k/revive-action@v2.7.8
      with:
        path: 'ch1_integration/01_04_ci_for_go/...'

    - name: Build
      working-directory: ch1_integration/01_04_ci_for_go
      run: go build -v ./...

    - name: Test
      working-directory: ch1_integration/01_04_ci_for_go
      run: go test -v ./...

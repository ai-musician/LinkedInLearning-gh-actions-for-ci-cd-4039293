# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v6.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: ch1_integration/01_03_ci_for_python/requirements.txt
      - name: Install dependencies
        working-directory: ch1_integration/01_03_ci_for_python
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Lint with flake8
        working-directory: ch1_integration/01_03_ci_for_python
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      - name: Test with pytest
        working-directory: ch1_integration/01_03_ci_for_python
        run: |
          python -m pytest --verbose --junit-xml=junit.xml
      - name: Upload test results
        uses: mikepenz/action-junit-report@v6.1.0
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: "**/junit.xml"
          detailed_summary: true
          include_passed: true
